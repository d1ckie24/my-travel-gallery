<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d1ckie的旅行相册</title>

    <!-- Tailwind CSS 极速样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PhotoSwipe 5 核心样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe.css">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f8fafc; 
            color: #1e293b;
            padding-bottom: 90px; /* 留出底部音乐播放器空间 */
        }

        /* 📸 拍立得（Polaroid）相框与叠放 CSS 效果 */
        .photo-stack-card {
            perspective: 1000px;
            cursor: pointer;
        }

        /* 拍立得外观：上左右 8px 留白，底部 24px 经典留白相框 */
        .polaroid-frame {
            background-color: #ffffff;
            padding: 8px 8px 24px 8px;
            box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.1), 0 4px 10px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 6px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 多行文字截断控制（最多显示 2 行） */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 叠在底部的第 2 张拍立得 */
        .stack-layer-2 {
            transform: rotate(-6deg) scale(0.95) translateY(2px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 叠在底部的第 3 张拍立得 */
        .stack-layer-3 {
            transform: rotate(6deg) scale(0.9) translateY(4px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 悬停/点击时后方拍立得向两边展开 */
        .photo-stack-card:hover .stack-layer-2,
        .photo-stack-card:active .stack-layer-2 {
            transform: rotate(-11deg) scale(0.97) translateX(-8px) translateY(-2px);
        }

        .photo-stack-card:hover .stack-layer-3,
        .photo-stack-card:active .stack-layer-3 {
            transform: rotate(11deg) scale(0.93) translateX(8px) translateY(-2px);
        }

        /* 视图切换平滑淡入动画 */
        .view-fade-enter {
            animation: fadeInScale 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.97) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 🔴 PhotoSwipe 放大预览页中的“下载原图”高亮按钮 */
        .pswp__button--download-custom {
            background: #e63946 !important;
            color: #ffffff !important;
            width: auto !important;
            padding: 0 16px !important;
            border-radius: 20px !important;
            height: 36px !important;
            margin-top: 8px !important;
            margin-right: 12px !important;
            font-weight: bold !important;
            font-size: 13px !important;
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
            opacity: 1 !important;
            box-shadow: 0 2px 8px rgba(230, 57, 70, 0.4);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .pswp__button--download-custom:hover {
            background: #d62828 !important;
            transform: scale(1.05);
        }

        /* 💬 微信端专属长按保存图片弹窗 */
        .wechat-save-modal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 🎵 悬浮唱片音乐播放器样式 */
        .music-player-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            border-radius: 40px;
            padding: 8px 16px 8px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
            transition: all 0.3s ease;
        }
        .disc-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c3e50, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }
        .disc-wrapper::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
        }
        .disc-wrapper.playing {
            animation: disc-rotate 8s linear infinite;
        }
        @keyframes disc-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 页头 HEADER -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-sm/50">
        <div class="max-w-6xl mx-auto px-4 py-3 md:py-4 flex items-center justify-between min-h-[64px]">
            <!-- 左侧主区：包含左上角大返回按钮与主标题 -->
            <div class="flex items-center gap-3">
                <!-- 👈 左上角大号返回按钮（符合原生 App 手势，醒目好按） -->
                <button id="backBtn" class="hidden items-center gap-1.5 bg-slate-800 hover:bg-slate-900 active:bg-black text-white text-sm md:text-base font-bold px-4 py-2 rounded-2xl transition-all active:scale-95 shadow-md">
                    <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>返回</span>
                </button>

                <!-- 网站标题组 -->
                <div id="headerTitleGroup">
                    <h1 class="text-lg md:text-xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                        📸 d1ckie的旅行相册
                    </h1>
                    <p class="text-[11px] md:text-xs text-slate-500 mt-0.5">收集地图上的每一个世界</p>
                </div>
            </div>

            <!-- 右侧辅助徽章 -->
            <div id="headerRightBadge">
                <span id="tripCountBadge" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-semibold border border-slate-200/60">0 个行程</span>
            </div>
        </div>
    </header>

    <!-- 主体容器 -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- 1. 行程相片叠网格主视图 (Grid View) -->
        <section id="tripGridView" class="view-fade-enter">
            <div class="mb-5 flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 tracking-wider uppercase">行程概览（按时间正序）</span>
            </div>
            
            <!-- ⭐ 手机端 2 列，电脑端 3 列网格 -->
            <div id="tripGrid" class="grid grid-cols-2 md:grid-cols-3 gap-5 md:gap-7"></div>
        </section>

        <!-- 2. 单个行程照片详情视图 (Detail View) -->
        <section id="tripDetailView" class="hidden view-fade-enter">
            <div class="mb-5 pb-3 border-b border-slate-200/80 flex items-center justify-between">
                <div>
                    <h2 id="currentTripTitle" class="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2"></h2>
                    <p id="currentTripSub" class="text-xs text-slate-400 mt-1"></p>
                </div>
            </div>

            <!-- 详情页照片网格 (手机 2 列，电脑 4 列) -->
            <div id="detailPhotoGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 pswp-gallery"></div>
        </section>
    </main>

    <!-- 🎵 卢广仲《几分之几》悬浮音乐播放器 -->
    <div class="music-player-widget" id="musicWidget">
        <audio id="bgMusic" loop preload="auto">
            <source src="music.mp3" type="audio/mpeg">
        </audio>
        <div class="disc-wrapper" id="discWrapper" title="点击播放/暂停">
            <span style="color: #f1c40f; font-size: 16px; z-index: 1;">🎵</span>
        </div>
        <div class="flex flex-col text-left leading-tight pr-1">
            <span class="text-xs font-bold text-slate-800">几分之几</span>
            <span class="text-[10px] text-slate-500 mt-0.5">卢广仲</span>
        </div>
        <button id="musicToggleBtn" class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs shadow-md hover:bg-rose-600 transition active:scale-95 ml-1">
            <span id="musicBtnIcon">▶</span>
        </button>
    </div>

    <!-- PhotoSwipe 5 脚本模块 -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        import PhotoSwipe from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe.esm.js';

        let allPhotoData = [];
        let tripGroups = {};

        const tripGridView = document.getElementById('tripGridView');
        const tripDetailView = document.getElementById('tripDetailView');
        const tripGrid = document.getElementById('tripGrid');
        const detailPhotoGrid = document.getElementById('detailPhotoGrid');
        const backBtn = document.getElementById('backBtn');
        const currentTripTitle = document.getElementById('currentTripTitle');
        const currentTripSub = document.getElementById('currentTripSub');
        const tripCountBadge = document.getElementById('tripCountBadge');

        // 1. 初始化拉取数据
        fetch('photos.json')
            .then(res => res.json())
            .then(photos => {
                allPhotoData = photos;

                // 优先按 trip 分组
                photos.forEach(photo => {
                    const groupKey = photo.trip || photo.date || '随手抓拍';
                    if (!tripGroups[groupKey]) tripGroups[groupKey] = [];
                    tripGroups[groupKey].push(photo);
                });

                // 📅 时间正序排列：较早时间的行程排在前面 (如 2024 排在 2026 前面)
                const sortedKeys = Object.keys(tripGroups).sort((a, b) => {
                    return a.localeCompare(b, 'zh-CN', { numeric: true, sensitivity: 'base' });
                });

                tripCountBadge.textContent = `${sortedKeys.length} 个行程`;

                // 渲染主页相片叠网格
                renderTripStacks(sortedKeys);
            });

        // 2. 渲染相片叠小格子
        function renderTripStacks(sortedKeys) {
            tripGrid.innerHTML = '';

            sortedKeys.forEach(tripKey => {
                const photos = tripGroups[tripKey];
                const count = photos.length;

                // ⭐ 优先加载高清大图 (url_large 或 src)，保证卡片封面无比清晰
                const cover1 = photos[0]?.url_large || photos[0]?.src || photos[0]?.url_thumb || photos[0]?.thumb;
                const cover2 = photos[1]?.url_large || photos[1]?.src || photos[1]?.url_thumb || photos[1]?.thumb || cover1;
                const cover3 = photos[2]?.url_large || photos[2]?.src || photos[2]?.url_thumb || photos[2]?.thumb || cover1;

                const card = document.createElement('div');
                card.className = 'photo-stack-card group relative flex flex-col';

                card.innerHTML = `
                    <!-- 3D 拍立得照片叠框架（高宽比 3:4，为两行标题提供充足纵向空间） -->
                    <div class="relative w-full aspect-[3/4] mb-2">
                        <!-- 第 3 层 (最底部拍立得) -->
                        <div class="stack-layer-3 polaroid-frame absolute inset-0 opacity-70 overflow-hidden">
                            <div class="w-full h-full bg-slate-100 overflow-hidden rounded-sm">
                                <img src="${cover3}" loading="lazy" class="w-full h-full object-cover" />
                            </div>
                        </div>
                        
                        <!-- 第 2 层 (中间层拍立得) -->
                        <div class="stack-layer-2 polaroid-frame absolute inset-0 opacity-85 overflow-hidden">
                            <div class="w-full h-full bg-slate-100 overflow-hidden rounded-sm">
                                <img src="${cover2}" loading="lazy" class="w-full h-full object-cover" />
                            </div>
                        </div>

                        <!-- 第 1 层 (顶层主拍立得) -->
                        <div class="relative z-10 w-full h-full polaroid-frame flex flex-col justify-between group-hover:shadow-2xl transition-shadow">
                            <!-- 拍立得照片主体 (正方形) -->
                            <div class="relative w-full aspect-square overflow-hidden rounded-sm bg-slate-100">
                                <img src="${cover1}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                
                                <!-- 照片张数 Badge -->
                                <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm z-10">
                                    ${count} 张
                                </div>
                            </div>

                            <!-- 拍立得底部白色留白区域 (行程标题与日期，支持双行折行) -->
                            <div class="pt-2 px-0.5 flex flex-col justify-end">
                                <h3 class="text-xs sm:text-sm font-bold text-slate-800 line-clamp-2 leading-snug group-hover:text-rose-500 transition-colors">
                                    📍 ${tripKey}
                                </h3>
                                <p class="text-[10px] sm:text-[11px] text-slate-400 mt-1 truncate">
                                    ${photos[0]?.date ? `🗓️ ${photos[0].date}` : '精彩瞬间'}
                                </p>
                            </div>
                        </div>
                    </div>
                `;

                // 点击进入详情
                card.addEventListener('click', () => {
                    openTripDetail(tripKey, photos);
                });

                tripGrid.appendChild(card);
            });
        }

        // 3. 打开行程详情视图
        function openTripDetail(tripKey, photos) {
            currentTripTitle.innerHTML = `📍 ${tripKey}`;
            currentTripSub.textContent = `共 ${photos.length} 张照片 · 点击可查看高清原图`;

            detailPhotoGrid.innerHTML = '';

            photos.forEach(photo => {
                const item = document.createElement('a');
                item.className = 'relative aspect-square rounded-xl overflow-hidden bg-slate-200 shadow-sm hover:shadow-md transition-all active:scale-95 block group';
                item.href = photo.url_large || photo.src;
                item.dataset.pswpWidth = photo.width || 1920;
                item.dataset.pswpHeight = photo.height || 1080;
                item.dataset.rawUrl = photo.url_raw || photo.src;
                item.target = '_blank';

                const thumbSrc = photo.url_thumb || photo.thumb || photo.src;
                item.innerHTML = `
                    <img src="${thumbSrc}" loading="lazy" alt="${photo.title || 'photo'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                `;
                detailPhotoGrid.appendChild(item);
            });

            // 切换视图与显示左上角大返回按钮
            tripGridView.classList.add('hidden');
            tripDetailView.classList.remove('hidden');
            
            backBtn.classList.remove('hidden');
            backBtn.classList.add('inline-flex');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. 返回主视图
        backBtn.addEventListener('click', () => {
            tripDetailView.classList.add('hidden');
            tripGridView.classList.remove('hidden');
            
            backBtn.classList.add('hidden');
            backBtn.classList.remove('inline-flex');
        });

        // 💬 微信专属长按保存弹窗
        function showWeChatSaveModal(imgUrl) {
            const existingModal = document.getElementById('wechatModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'wechatModal';
            modal.className = 'wechat-save-modal';
            modal.innerHTML = `
                <div class="relative max-w-sm w-full bg-slate-900/90 border border-slate-700/60 rounded-3xl p-5 text-center text-white shadow-2xl flex flex-col items-center">
                    <!-- 关闭按钮 -->
                    <button id="closeWechatModal" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center hover:bg-slate-700 text-sm font-bold">
                        ✕
                    </button>

                    <div class="inline-flex items-center gap-1.5 bg-rose-500/20 text-rose-300 text-xs font-bold px-3 py-1 rounded-full mb-3 border border-rose-500/30">
                        💡 微信保存提示
                    </div>
                    
                    <p class="text-sm font-semibold mb-4 text-slate-200">
                        请 <span class="text-rose-400 font-bold">长按下方图片</span> 选择“保存图片”
                    </p>

                    <!-- 高清原图容器 (供长按) -->
                    <div class="relative max-h-[55vh] w-full rounded-xl overflow-hidden bg-black/50 border border-slate-700 flex items-center justify-center mb-4">
                        <img src="${imgUrl}" class="max-h-[55vh] w-auto object-contain select-none" alt="原图" />
                    </div>

                    <button id="confirmCloseModal" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl transition">
                        知道了 / 关闭
                    </button>
                </div>
            `;

            document.body.appendChild(modal);

            const closeModal = () => modal.remove();
            document.getElementById('closeWechatModal').onclick = closeModal;
            document.getElementById('confirmCloseModal').onclick = closeModal;
            modal.onclick = (e) => {
                if (e.target === modal) closeModal();
            };
        }

        // 5. Blob 二进制下载函数（完美兼容手机端直接下载到相册/本地）
        async function downloadImageDirectly(url, btnEl) {
            const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
            
            // 💡 微信环境下直接拦截，弹出长按保存指导弹窗
            if (isWeChat) {
                showWeChatSaveModal(url);
                return;
            }

            const originalText = btnEl.innerHTML;
            btnEl.innerHTML = '⏳ 下载中...';
            btnEl.style.pointerEvents = 'none';

            try {
                const response = await fetch(url, { mode: 'cors' });
                if (!response.ok) throw new Error('网络请求失败');
                const blob = await response.blob();
                
                // 提取文件扩展名与文件名
                const fileExt = url.split('.').pop().split('?')[0] || 'webp';
                const filename = `photo_${Date.now()}.${fileExt}`;

                // 创建 Blob 临时链接触发浏览器保存
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);

                btnEl.innerHTML = '✅ 已下载';
                setTimeout(() => {
                    btnEl.innerHTML = originalText;
                    btnEl.style.pointerEvents = 'auto';
                }, 2000);
            } catch (err) {
                console.warn('Direct Blob download failed:', err);
                btnEl.innerHTML = originalText;
                btnEl.style.pointerEvents = 'auto';
                showWeChatSaveModal(url);
            }
        }

        // 6. 初始化 PhotoSwipe 5 灯箱弹窗与原图下载按钮
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#detailPhotoGrid',
            children: 'a',
            pswpModule: PhotoSwipe
        });

        lightbox.on('uiRegister', function() {
            lightbox.pswp.ui.registerElement({
                name: 'download-button',
                order: 8,
                isButton: true,
                tagName: 'button',
                html: '⬇️ 下载原图',
                onInit: (el, pswp) => {
                    el.classList.add('pswp__button--download-custom');
                    el.onclick = (e) => {
                        e.preventDefault();
                        const currSlide = pswp.currSlide;
                        const rawUrl = currSlide.data.element.dataset.rawUrl || currSlide.data.src;
                        if (rawUrl) {
                            downloadImageDirectly(rawUrl, el);
                        }
                    };
                }
            });
        });

        lightbox.init();

        // 7. 🎵 智能背景音乐播放器控制
        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicBtnIcon = document.getElementById('musicBtnIcon');
        const discWrapper = document.getElementById('discWrapper');
        let isPlaying = false;

        function playMusic() {
            bgMusic.play().then(() => {
                musicBtnIcon.textContent = '❚❚';
                discWrapper.classList.add('playing');
                isPlaying = true;
            }).catch(() => {
                isPlaying = false;
            });
        }

        function pauseMusic() {
            bgMusic.pause();
            musicBtnIcon.textContent = '▶';
            discWrapper.classList.remove('playing');
            isPlaying = false;
        }

        function toggleMusic(e) {
            if (e) e.stopPropagation();
            if (isPlaying) pauseMusic();
            else playMusic();
        }

        playMusic();

        // 浏览器自动播放限制防护：用户首次点击页面任意位置唤醒音乐
        const handleFirstInteraction = () => {
            if (!isPlaying) playMusic();
            document.removeEventListener('click', handleFirstInteraction);
            document.removeEventListener('touchstart', handleFirstInteraction);
        };
        document.addEventListener('click', handleFirstInteraction, { once: true });
        document.addEventListener('touchstart', handleFirstInteraction, { once: true });

        musicToggleBtn.addEventListener('click', toggleMusic);
        discWrapper.addEventListener('click', toggleMusic);
    </script>
</body>
</html>
