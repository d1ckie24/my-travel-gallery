<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d1ckie的旅行相册</title>
    <!-- PhotoSwipe 5 核心样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f6f8; 
            color: #2c3e50;
            padding-bottom: 90px; /* 留出底部音乐播放器空间 */
        }

        header { 
            text-align: center; 
            padding: 32px 16px 20px; 
            background: #ffffff;
            border-bottom: 1px solid #eef2f5;
            margin-bottom: 20px;
        }
        header h1 { font-size: 1.6rem; font-weight: 700; color: #1a1a1a; }
        header p { color: #7f8c8d; font-size: 0.9rem; margin-top: 6px; }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 12px;
        }

        /* 📅 日期/行程分组折叠卡片 */
        .group-card {
            background: #ffffff;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid #eaeaea;
        }

        /* 折叠头部栏 */
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            background: #ffffff;
            transition: background 0.2s;
        }
        .group-header:active { background: #f8f9fa; }

        .group-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .group-badge {
            font-size: 0.8rem;
            color: #666666;
            background: #f0f2f5;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: normal;
        }

        .arrow-icon {
            font-size: 0.8rem;
            color: #999999;
            transition: transform 0.3s ease;
        }

        /* 折叠状态 */
        .group-card.collapsed .group-body { display: none; }
        .group-card.collapsed .arrow-icon { transform: rotate(-90deg); }

        .group-body {
            padding: 12px;
            border-top: 1px solid #f5f5f5;
            background: #fafafa;
        }

        /* 🖼️ 照片网格布局：电脑端多列，手机端强制双列 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        /* 📱 手机端适配：强制设置为 2 列网格 */
        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px; /* 紧凑间距，充分利用屏幕 */
            }
            .group-header { padding: 14px 16px; }
            .group-body { padding: 8px; }
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1 / 1; /* 统一正方形网格 */
            border-radius: 8px;
            overflow: hidden;
            background: #e2e8f0;
            cursor: pointer;
            display: block;
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }
        .photo-card:active img { transform: scale(0.96); }

        /* 🔴 PhotoSwipe 放大预览页中的“下载原图”高亮按钮 */
        .pswp__button--download-custom {
            background: #e63946 !important;
            color: #ffffff !important;
            width: auto !important;
            padding: 0 16px !important;
            border-radius: 20px !important;
            height: 36px !important;
            margin-top: 8px !important;
            margin-right: 12px !important;
            font-weight: bold !important;
            font-size: 13px !important;
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
            opacity: 1 !important;
            box-shadow: 0 2px 8px rgba(230, 57, 70, 0.4);
            border: none;
            cursor: pointer;
        }

        /* 🎵 卢广仲《几分之几》悬浮音乐播放器 */
        .music-player-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
            border-radius: 40px;
            padding: 8px 16px 8px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
        }
        .music-player-widget:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16);
        }
        .disc-wrapper {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c3e50, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }
        .disc-wrapper::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
        }
        .disc-wrapper.playing {
            animation: disc-rotate 8s linear infinite;
        }
        @keyframes disc-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .music-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            max-width: 120px;
        }
        .music-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-artist {
            font-size: 0.72rem;
            color: #7f8c8d;
            margin-top: 2px;
        }
        .music-control-btn {
            background: #e63946;
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
            margin-left: 4px;
        }
        .music-control-btn:hover {
            background: #d62828;
            transform: scale(1.08);
        }
        .music-control-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 480px) {
            .music-player-widget {
                bottom: 16px;
                right: 16px;
                padding: 6px 12px 6px 6px;
            }
            .disc-wrapper { width: 36px; height: 36px; }
            .music-title { font-size: 0.8rem; }
            .music-control-btn { width: 30px; height: 30px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📸 我的旅行相册</h1>
        <p>点击行程分类可展开/折叠，点击照片查看原图</p>
    </header>

    <div class="main-container" id="mainContainer"></div>

    <!-- 🎵 卢广仲《几分之几》悬浮背景音乐播放器 -->
    <div class="music-player-widget" id="musicWidget">
        <audio id="bgMusic" loop preload="auto">
            <!-- 优先读取同目录下的 music.mp3 -->
            <source src="music.mp3" type="audio/mpeg">
        </audio>
        <div class="disc-wrapper" id="discWrapper" title="点击播放/暂停">
            <span style="color: #f1c40f; font-size: 18px; z-index: 1;">🎵</span>
        </div>
        <div class="music-info">
            <span class="music-title">几分之几</span>
            <span class="music-artist">卢广仲</span>
        </div>
        <button class="music-control-btn" id="musicToggleBtn" title="播放/暂停背景音乐">
            <span id="musicBtnIcon">▶</span>
        </button>
    </div>

    <!-- PhotoSwipe 5 JS 模块 -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        import PhotoSwipe from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe.esm.js';

        // 1. 获取 photos.json 并渲染相册网格
        fetch('photos.json')
            .then(res => res.json())
            .then(photos => {
                const container = document.getElementById('mainContainer');
                
                // 优先按 trip (行程分类) 分组，若无则按 date 分组
                const groups = {};
                photos.forEach(photo => {
                    const groupKey = photo.trip || photo.date || '随手抓拍';
                    if (!groups[groupKey]) groups[groupKey] = [];
                    groups[groupKey].push(photo);
                });

                let isFirstGroup = true;

                // 渲染每个分组卡片
                Object.keys(groups).forEach(groupKey => {
                    const groupPhotos = groups[groupKey];

                    const card = document.createElement('div');
                    // 第一组默认展开，后续组默认收起
                    card.className = `group-card ${isFirstGroup ? '' : 'collapsed'}`;
                    isFirstGroup = false;

                    card.innerHTML = `
                        <div class="group-header">
                            <div class="group-title">
                                📍 <span>${groupKey}</span>
                                <span class="group-badge">${groupPhotos.length} 张照片</span>
                            </div>
                            <span class="arrow-icon">▼</span>
                        </div>
                        <div class="group-body">
                            <div class="photo-grid pswp-gallery" id="gallery-${encodeURIComponent(groupKey)}"></div>
                        </div>
                    `;

                    // 点击 Header 切换展开/折叠
                    const header = card.querySelector('.group-header');
                    header.addEventListener('click', () => {
                        card.classList.toggle('collapsed');
                    });

                    // 填入网格图片
                    const grid = card.querySelector('.photo-grid');
                    groupPhotos.forEach(photo => {
                        const item = document.createElement('a');
                        item.className = 'photo-card';
                        item.href = photo.url_large || photo.src; // 高清图预览
                        item.dataset.pswpWidth = photo.width || 1920;
                        item.dataset.pswpHeight = photo.height || 1080;
                        item.dataset.rawUrl = photo.url_raw || photo.src; // 超清原图下载链接
                        item.target = '_blank';

                        // 优先读取轻量缩略图 photo.url_thumb
                        const thumbSrc = photo.url_thumb || photo.thumb || photo.src;
                        item.innerHTML = `<img src="${thumbSrc}" loading="lazy" alt="${photo.title || 'photo'}" />`;
                        grid.appendChild(item);
                    });

                    container.appendChild(card);
                });

                // 2. 初始化 PhotoSwipe 灯箱弹窗与下载按钮
                const lightbox = new PhotoSwipeLightbox({
                    gallery: '.pswp-gallery',
                    children: 'a',
                    pswpModule: PhotoSwipe
                });

                // 注册“下载原图”按钮
                lightbox.on('uiRegister', function() {
                    lightbox.pswp.ui.registerElement({
                        name: 'download-button',
                        order: 8,
                        isButton: true,
                        tagName: 'button',
                        html: '⬇️ 下载原图',
                        onInit: (el, pswp) => {
                            el.classList.add('pswp__button--download-custom');
                            el.onclick = (e) => {
                                e.preventDefault();
                                const currSlide = pswp.currSlide;
                                const rawUrl = currSlide.data.element.dataset.rawUrl;
                                if (rawUrl) {
                                    window.open(rawUrl, '_blank');
                                }
                            };
                        }
                    });
                });

                lightbox.init();

                // 3. 🎵 智能背景音乐控制（兼顾自动播放与浏览器策略拦截）
                const bgMusic = document.getElementById('bgMusic');
                const musicToggleBtn = document.getElementById('musicToggleBtn');
                const musicBtnIcon = document.getElementById('musicBtnIcon');
                const discWrapper = document.getElementById('discWrapper');
                let isPlaying = false;

                function playMusic() {
                    bgMusic.play().then(() => {
                        musicBtnIcon.textContent = '❚❚';
                        discWrapper.classList.add('playing');
                        isPlaying = true;
                    }).catch(err => {
                        console.log('直接自动播放被拦截，等待用户第一次点击页面激活...');
                        isPlaying = false;
                    });
                }

                function pauseMusic() {
                    bgMusic.pause();
                    musicBtnIcon.textContent = '▶';
                    discWrapper.classList.remove('playing');
                    isPlaying = false;
                }

                function toggleMusic(e) {
                    if (e) e.stopPropagation();
                    if (isPlaying) {
                        pauseMusic();
                    } else {
                        playMusic();
                    }
                }

                // ① 打开页面时尝试直接播放
                playMusic();

                // ② 若直接播放被限制，监听全页面的第一次点击/触摸，触发播放
                const handleFirstInteraction = () => {
                    if (!isPlaying) {
                        playMusic();
                    }
                    // 触发一次后自动移除监听器，不影响后续正常操作
                    document.removeEventListener('click', handleFirstInteraction);
                    document.removeEventListener('touchstart', handleFirstInteraction);
                };

                document.addEventListener('click', handleFirstInteraction, { once: true });
                document.addEventListener('touchstart', handleFirstInteraction, { once: true });

                // 按钮手动切换控制
                musicToggleBtn.addEventListener('click', toggleMusic);
                discWrapper.addEventListener('click', toggleMusic);
            });
    </script>
</body>
</html>
