<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 我的旅行相册</title>
    <!-- PhotoSwipe 5 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f6f8; 
            color: #2c3e50;
            padding-bottom: 40px;
        }

        header { 
            text-align: center; 
            padding: 30px 16px 15px; 
            background: #fff;
            border-bottom: 1px solid #eef2f5;
            margin-bottom: 20px;
        }
        header h1 { font-size: 1.6rem; font-weight: 700; color: #1a1a1a; }
        header p { color: #7f8c8d; font-size: 0.9rem; margin-top: 4px; }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 12px;
        }

        /* 📅 分组折叠卡片 */
        .group-card {
            background: #fff;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow: hidden;
            border: 1px solid #eaeaea;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            background: #fff;
            transition: background 0.2s;
        }
        .group-header:active { background: #f8f9fa; }

        .group-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .group-badge {
            font-size: 0.8rem;
            color: #666;
            background: #f0f2f5;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .arrow-icon {
            font-size: 0.8rem;
            color: #999;
            transition: transform 0.3s ease;
        }

        /* 折叠状态 */
        .group-card.collapsed .group-body { display: none; }
        .group-card.collapsed .arrow-icon { transform: rotate(-90deg); }

        .group-body {
            padding: 12px;
            border-top: 1px solid #f5f5f5;
            background: #fafafa;
        }

        /* 🖼️ 照片网格：电脑端 4-5 列，手机端双列 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        /* 📱 手机端适配 (强制双列) */
        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 8px; 
            }
            .group-header { padding: 14px 16px; }
            .group-body { padding: 8px; }
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1 / 1; 
            border-radius: 8px;
            overflow: hidden;
            background: #e2e8f0;
            cursor: pointer;
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }
        .photo-card:active img { transform: scale(0.96); }

        /* 🔥 高亮红底下载按钮 */
        .pswp__button--download-custom {
            background: #e63946 !important;
            color: #ffffff !important;
            width: auto !important;
            padding: 0 16px !important;
            border-radius: 20px !important;
            height: 36px !important;
            margin-top: 8px !important;
            margin-right: 12px !important;
            font-weight: bold !important;
            font-size: 13px !important;
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
            opacity: 1 !important;
            box-shadow: 0 2px 8px rgba(230, 57, 70, 0.4);
            border: none;
            cursor: pointer;
        }
        .pswp__button--download-custom:hover { background: #d62828 !important; }
    </style>
</head>
<body>

    <header>
        <h1>📸 我的旅行相册</h1>
        <p>点击日期条可展开/折叠，点击照片查看原图</p>
    </header>

    <div class="main-container" id="mainContainer"></div>

    <script type="module">
        import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        import PhotoSwipe from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.3/dist/photoswipe.esm.js';

        fetch('photos.json')
            .then(res => res.json())
            .then(photos => {
                const container = document.getElementById('mainContainer');
                
                // 按日期归类
                const groups = {};
                photos.forEach(photo => {
                    const date = photo.date || '其他记录';
                    if (!groups[date]) groups[date] = [];
                    groups[date].push(photo);
                });

                let isFirstGroup = true;

                // 渲染每个折叠卡片
                Object.keys(groups).forEach(date => {
                    const groupPhotos = groups[date];

                    const card = document.createElement('div');
                    // 默认展开第一个（最新的日期），其余折叠
                    card.className = `group-card ${isFirstGroup ? '' : 'collapsed'}`;
                    isFirstGroup = false;

                    card.innerHTML = `
                        <div class="group-header">
                            <div class="group-title">
                                📅 <span>${date}</span>
                                <span class="group-badge">${groupPhotos.length} 张</span>
                            </div>
                            <span class="arrow-icon">▼</span>
                        </div>
                        <div class="group-body">
                            <div class="photo-grid pswp-gallery" id="gallery-${date}"></div>
                        </div>
                    `;

                    // 展开/折叠交互
                    card.querySelector('.group-header').addEventListener('click', () => {
                        card.classList.toggle('collapsed');
                    });

                    // 填充网格
                    const grid = card.querySelector('.photo-grid');
                    groupPhotos.forEach(photo => {
                        const item = document.createElement('a');
                        item.className = 'photo-card';
                        item.href = photo.url_large; 
                        item.dataset.pswpWidth = photo.width || 1920;
                        item.dataset.pswpHeight = photo.height || 1080;
                        item.dataset.rawUrl = photo.url_raw; 
                        item.target = '_blank';

                        item.innerHTML = `<img src="${photo.url_thumb}" loading="lazy" alt="photo" />`;
                        grid.appendChild(item);
                    });

                    container.appendChild(card);
                });

                // 初始化 PhotoSwipe
                const lightbox = new PhotoSwipeLightbox({
                    gallery: '.pswp-gallery',
                    children: 'a',
                    pswpModule: PhotoSwipe
                });

                // 注入高亮下载按钮
                lightbox.on('uiRegister', function() {
                    lightbox.pswp.ui.registerElement({
                        name: 'download-button',
                        order: 8,
                        isButton: true,
                        tagName: 'button',
                        html: '⬇️ 下载原图',
                        onInit: (el, pswp) => {
                            el.classList.add('pswp__button--download-custom');
                            el.onclick = (e) => {
                                e.preventDefault();
                                const currSlide = pswp.currSlide;
                                const rawUrl = currSlide.data.element.dataset.rawUrl;
                                if (rawUrl) {
                                    window.open(rawUrl, '_blank');
                                }
                            };
                        }
                    });
                });

                lightbox.init();
            });
    </script>
</body>
</html>
